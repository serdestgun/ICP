name: Görselleri doğrula
on:
  push:
    paths: ["gunluk-bilgi/data/**", ".github/scripts/gorselleri-dogrula.mjs", ".github/workflows/gorselleri-dogrula.yml"]
  pull_request:
    paths: ["gunluk-bilgi/data/**"]
jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/scripts/gorselleri-dogrula.mjs
